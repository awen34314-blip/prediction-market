name: Fork Auto-Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'kuest/prediction-market'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git author/committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        shell: bash
        run: |
          git remote get-url upstream || git remote add upstream https://github.com/kuest/prediction-market.git
          git fetch upstream main:refs/remotes/upstream/main
          bash scripts/sync-upstream.sh
          git push origin HEAD:main
